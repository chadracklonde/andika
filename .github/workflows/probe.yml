name: Sonde modèle Android
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          flutter --version
          flutter create --org org.example --project-name probe --platforms android /tmp/probe
          cd /tmp/probe/android
          echo "=== wrapper"; cat gradle/wrapper/gradle-wrapper.properties
          echo "=== settings"; cat settings.gradle.kts
          echo "=== app build"; cat app/build.gradle.kts
          echo "=== root build"; cat build.gradle.kts
          echo "=== gradle.properties"; cat gradle.properties
