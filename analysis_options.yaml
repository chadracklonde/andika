analyzer:
  errors:
    todo: ignore
    # DropdownButtonFormField.value est signalé obsolète sur les Flutter récents mais reste valable.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
